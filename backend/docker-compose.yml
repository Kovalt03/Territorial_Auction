services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: territorial-postgres
    environment:
      POSTGRES_DB: territorial_auction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    container_name: territorial-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: territorial-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: territorial_auction
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 관리자 페이지 테스트용 — IP 화이트리스트 비움(전체 허용) + 시드 관리자 자동 생성
      ADMIN_IP_ALLOWLIST: ""
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@territorial.local}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-admin1234!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
